<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw SMS Bridge</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --ink: #1f2528;
      --muted: #596166;
      --line: #d8d2c5;
      --accent: #0e6f68;
      --accent-dark: #084f4a;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    main {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 64px 0;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.05rem;
    }
    nav {
      display: grid;
      gap: 12px;
      margin-top: 32px;
    }
    a {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }
    a span {
      color: var(--muted);
      font-weight: 500;
    }
    a:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>OpenClaw SMS Bridge</h1>
    <p>Public policy pages for the OpenClaw Twilio SMS integration.</p>
    <nav aria-label="Policy pages">
      <a href="privacy-policy.html">Privacy Policy <span>View page</span></a>
      <a href="terms-and-conditions.html">Terms and Conditions <span>View page</span></a>
    </nav>
  </main>
</body>
</html>
