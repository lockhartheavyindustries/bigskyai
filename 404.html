<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/bigsky-favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/bigsky-favicon-192.png">
  <title>Lost under the big sky · Big Sky AI</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172022;
      --soft-ink: #455356;
      --muted: #687477;
      --paper: #fbf7ee;
      --teal-dark: #074d4a;
      --coral: #d96f49;
      --line: rgba(23, 32, 34, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 88% 8%, rgba(215, 173, 87, 0.2), transparent 28rem),
        radial-gradient(circle at 5% 68%, rgba(13, 111, 106, 0.12), transparent 30rem),
        var(--paper);
      color: var(--ink);
      line-height: 1.55;
      padding: 24px;
    }

    main { max-width: 640px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 20px;
      color: var(--teal-dark);
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 2px;
      background: var(--coral);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 8vw, 4.6rem);
      line-height: 0.94;
      letter-spacing: -0.05em;
    }

    p {
      margin: 22px 0 0;
      color: var(--soft-ink);
      font-size: 1.1rem;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-weight: 800;
    }

    nav a { color: inherit; text-decoration: none; }

    nav a:hover,
    nav a:focus-visible { color: var(--coral); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404</p>
    <h1>Lost under the big sky.</h1>
    <p>That page isn&rsquo;t here&mdash;it may have moved when the site did. Everything that exists is one click away:</p>
    <nav aria-label="Main pages">
      <a href="/">Home</a>
      <a href="/ralph/">Ralph</a>
      <a href="/firetower/">Firetower</a>
      <a href="/weekly-ralph/">The Weekly Ralph</a>
      <a href="/about/">About</a>
      <a href="mailto:info@bigskyai.ai">Contact</a>
    </nav>
  </main>

  <script data-goatcounter="https://bigskyai.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

</html>
