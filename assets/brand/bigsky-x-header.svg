<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <title>Big Sky AI: Applied AI. Real results.</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063f3d"/>
      <stop offset="1" stop-color="#05393a"/>
    </linearGradient>
    <radialGradient id="glow" cx="1180" cy="0" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a5e4c" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3a5e4c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#sky)"/>
  <rect width="1500" height="500" fill="url(#glow)"/>
  <circle cx="90" cy="-40" r="230" fill="#fffaf0" fill-opacity="0.07"/>

  <!-- Text stays inside x 400-1180, y 110-370: clear of the profile picture X overlays at the bottom left and of mobile edge crops. -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <g fill="#d96f49">
      <rect x="470" y="136" width="48" height="4"/>
      <rect x="1062" y="136" width="48" height="4"/>
      <text x="790" y="150" font-size="28" letter-spacing="4">APPLIED AI. REAL RESULTS.</text>
    </g>
    <text x="790" y="285" font-size="150" fill="#fffaf0" letter-spacing="-2">BIG SKY AI</text>
    <text x="790" y="352" font-size="42" fill="#d7ad57">Big sky thinking. Down-to-earth work.</text>
  </g>

  <circle cx="1335" cy="300" r="72" fill="#d7ad57"/>
  <circle cx="1262" cy="378" r="30" fill="#d96f49"/>
</svg>
