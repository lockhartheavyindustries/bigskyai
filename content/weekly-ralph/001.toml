[[stories]]
number = "01"
category = "Home equipment"
title = "Turn a pile of pool equipment specs into a usable schedule"
lede = "The user did not need a generic article about pool pumps. They needed starting settings for this pool."
body = """
The request included the details that usually get left out: a 19,000-gallon pool, a 2.7-horsepower variable-speed pump, two skimmers, three returns, a large cartridge filter, and a 400,000 BTU gas heater.

Ralph turned those specifications into operating modes rather than one magic number. The starting schedule used low speed for long, quiet filtration; a higher window for effective surface skimming; and an override whenever the heater ran. It also included a short high-speed cleanup mode after heavy use or debris.

Most importantly, the answer explained how to tune the recommendation in the real system: begin around 1,600 RPM, confirm both skimmers still pull, raise speed in small steps, and establish the heater’s safe minimum flow with a margin above it.
"""
takeaway = "Specific inputs let AI move from generic advice to a testable starting plan. The best answer also tells the user how to verify and adjust it safely."
prompt = "Help me create starting settings for this equipment. Here are the exact model numbers, system size, plumbing layout, goals, and constraints. Separate normal, high-demand, and safety-critical modes."
caveat = "Equipment settings should be checked against manufacturer documentation and adjusted for the actual plumbing, flow, and safety controls."

[[stories]]
number = "02"
category = "Constraint-based research"
title = "Find a whole-house scent machine—but only one that connects to the HVAC"
lede = "One follow-up sentence changed the shopping category completely."
body = """
The initial request was for whole-home scent machines. Ralph narrowed the field to waterless cold-air nebulizers and compared options by coverage, tank size, scheduling, oil flexibility, and brand support.

Then the user sharpened the requirement: it needed to connect to the existing HVAC system. Ralph discarded the tabletop-diffuser frame and focused on machines that inject a dry scent mist into ductwork near the air handler. The answer separated a polished home option, a less expensive and more oil-flexible option, and a commercial system that would probably be excessive for an ordinary house.

It also caught the part a shopping list can miss: ducted scent can become overpowering quickly, and installation should be checked by an HVAC professional.
"""
takeaway = "Research becomes far more valuable when the user states the non-negotiable constraint. A strong assistant should reframe the entire search around it."
prompt = "Research products for [goal]. My non-negotiable requirement is [constraint]. Exclude anything that does not meet it, compare the remaining options, and flag installation or safety concerns."
caveat = "HVAC-connected equipment should be installed or reviewed by a qualified professional, particularly in homes with pets or scent-sensitive occupants."
