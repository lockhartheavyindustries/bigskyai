# Running changelog for the Ralph project.
# Add a new [[entries]] block at any position (newest first is customary);
# the build sorts by date descending. Then run `just check`.
# Public page — no member names, no private details.

[[entries]]
date = "2026-08-04"
title = "Ralph can remind you later"
body = """
Ralph can now send you a reminder at a time you choose. In your usual
one-on-one conversation, try something like, *Ralph, remind me tomorrow at
noon to call the dentist.* When the time comes, Ralph will post the reminder
back to that same conversation.

Reminders can happen once or repeat at a regular interval, every day, every
weekday, or on selected days of the week. You can also ask Ralph to show,
change, or cancel your scheduled reminders. After every addition, change, or
cancellation, Ralph confirms the action and shows your complete current list,
including whether each reminder will arrive through Slack or iMessage. If the
time or time zone is unclear, Ralph will ask before scheduling it.

This first release is deliberately focused on reminders. Ralph cannot yet run
a search, write a report, or perform other work at a future time&mdash;but
scheduled tasks like those are a possible next step after reminders have
proven dependable.
"""

[[entries]]
date = "2026-07-28"
title = "New skill: “Whassup with…”"
body = """
Ralph can now give you a quick snapshot of what people are saying on X about a
current news story, sports event, public figure, company, product launch, or
other trending topic. Text him `whassup with <topic>`&mdash;for example,
*whassup with the World Cup?* or *whassup with the latest iPhone
launch?*&mdash;and about a minute later he'll summarize what happened, why
people are discussing it, the major viewpoints, and notable posts you can read
for yourself.

Be sure to spell it &ldquo;whassup&rdquo; so Ralph recognizes the request. It
works for public topics&mdash;not personal questions&mdash;and it reflects
public conversation on X, which may include opinions, rumors, or incorrect
claims.
"""

[[entries]]
date = "2026-07-28"
title = "Ralph got a front door"
body = """
This website. A proper introduction to who Ralph is, why he exists, and what
he does all day&mdash;plus a plain-English tour of how he works, right down to
the full roster of AI models under the hood. Even the conversation screenshot
on the front page is real.
"""
